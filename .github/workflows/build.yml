name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk HourlyRecorder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HourlyRecorder-apk
          path: HourlyRecorder.apk
      - name: Publish release for in-app updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" HourlyRecorder.apk \
            --title "Version ${{ github.run_number }}" \
            --notes "Commit: ${{ github.event.head_commit.message }}" \
            --latest
      - name: Send instant push notification
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then echo "No FCM_SERVICE_ACCOUNT secret yet, skipping the push"; exit 0; fi
          pip install -q google-auth requests
          python3 .github/send_push.py "${{ github.run_number }}"
