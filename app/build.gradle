plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yunus.hourlyrecorder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yunus.hourlyrecorder'
        minSdk 24
        targetSdk 34
        def run = System.getenv('GITHUB_RUN_NUMBER')
        versionCode run ? run.toInteger() : 1
        versionName '1.' + (run ?: '0')
    }

    signingConfigs {
        shared {
            storeFile file('shared-key.jks')
            storePassword 'hourly-update-key'
            keyAlias 'hourly'
            keyPassword 'hourly-update-key'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.work:work-runtime:2.9.0'
}
